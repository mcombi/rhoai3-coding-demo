# MTA 8.3 instance.
# Developer Lightspeed / Kai proxy and Solution Server remain disabled
# (see BACKLOG). MTA Agents (Developer Preview, MTA-7422/7423) are enabled;
# they require the Agent Sandbox Operator and the configure-mta-maas-gateway
# PostSync job to provision Gateway CRs backed by MaaS.
# Ref: https://docs.redhat.com/en/documentation/migration_toolkit_for_applications/8.3/html-single/configuring_and_managing_the_migration_toolkit_for_applications_user_interface/index#configuring-and-using-mta-agents_use
apiVersion: tackle.konveyor.io/v1alpha1
kind: Tackle
metadata:
  name: mta
  namespace: openshift-mta
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  rwx_supported: "false"
  kai_llm_proxy_enabled: false
  kai_solution_server_enabled: false
  # MTA 8.3 built-in Hub OIDC provider with authentication enforced.
  # Sign-in federates to the platform realm (identity component) through
  # the platform-sso IdentityProvider CR, applied by the
  # configure-mta-platform-sso PostSync job; idp_primary auto-redirects
  # the console to platform SSO (same OpenShift login as RHDH).
  feature_auth_required: true
  idp_primary: true
  # MTA Agents (Developer Preview). Requires Agent Sandbox Operator.
  # Deploys agentic-controller and the operator-managed skill cards,
  # skill collection, and default migration agents/workflow.
  # agentic_steer_enabled allows interactive user steering during runs.
  agentic_enabled: "true"
  agentic_steer_enabled: "true"
