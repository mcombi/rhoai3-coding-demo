apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MTA component:
# Migration Toolkit for Applications 8.3 with MTA Agents (Developer Preview)
# backed by MaaS models. The stage 080 demo consumes this stack; omit this
# component via overlays/slim when the migration rung is not being demoed.
# Ref: https://docs.redhat.com/en/documentation/migration_toolkit_for_applications/8.3

resources:
  # Wave 0-2: Agent Sandbox Operator (prerequisite for MTA Agents)
  - agent-sandbox-operator/namespace.yaml
  - agent-sandbox-operator/operatorgroup.yaml
  - agent-sandbox-operator/subscription.yaml
  # Wave 0-2: MTA Operator (8.3)
  - mta-operator/namespace.yaml
  - mta-operator/operatorgroup.yaml
  - mta-operator/subscription.yaml
  # Wave 10: Tackle CR (MTA 8.3: Hub OIDC + SSO federation + MTA Agents enabled)
  - mta-instance/tackle.yaml
  # Wave 15: ConsoleLink (OpenShift launcher menu entry)
  - mta-instance/consolelink.yaml
  # PostSync: federate the Hub OIDC provider to the platform realm
  # (realm roles + mta-hub client in identity/'s RHBK, IdP client Secret,
  # IdentityProvider CR, hub restart)
  - jobs/configure-mta-platform-sso.yaml
  # PostSync: mta-hub-config ConfigMaps (external hub URL) per workspace namespace
  - jobs/mta-hub-workspace-config.yaml
  # PostSync (wave 28): provision MaaS API key and apply konveyor.io/v1alpha1
  # Gateway CRs (maas-qwen3-8b-int4, maas-qwen3-6-27b) in openshift-mta.
  # Depends on: MaaS hostname ready, agentic-controller CRD registered.
  - jobs/configure-mta-maas-gateway.yaml
